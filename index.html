    .toggle-btn {

      background: #fff; color: #555;

    .tier-pill {

      padding: 4px 11px; border-radius: 20px;

      background: #fff; cursor: pointer; transition: all 0.15s;

    .tier-pill[data-tier="iconic"]   { color: #185FA5; }
    .tier-pill[data-tier="iconic"].active   { background: #378ADD; }
    .tier-pill[data-tier="hidden"]   { color: #3B6D11; }
    .tier-pill[data-tier="hidden"].active   { background: #3B6D11; }
    .tier-pill[data-tier="fitness"]  { color: #534AB7; }
    .tier-pill[data-tier="fitness"].active  { background: #7F77DD; }
    .tier-pill[data-tier="interest"] { color: #854F0B; }
    .tier-pill[data-tier="interest"].active { background: #BA7517; }
    .tier-pill[data-tier="solid"]    { color: #5F5E5A; }
    .tier-pill[data-tier="solid"].active    { background: #888780; }

    #map { width: 100%; height: calc(100vh - 104px); }

    .legend {
      background: #fff;
      padding: 8px 20px;
      border-top: 1px solid #e5e5e3;
      display: flex; flex-wrap: wrap;
      gap: 12px; align-items: center;

    .gm-style-iw-tc { display: none; }

    .car-prev { left: 8px; }
    .car-next { right: 8px; }
    .car-dots { position: absolute; bottom: 6px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; z-index: 5; }

    .iw-link { font-size: 11px; color: #2563eb; text-decoration: none; font-weight: 500; white-space: nowrap; }

// ─── CONFIG ───────────────────────────────────────────────────────────────────
const TIER_COLORS = {
  iconic:   "#378ADD",
  hidden:   "#3B6D11",
  fitness:  "#7F77DD",
  interest: "#BA7517",
  solid:    "#888780",
};
const TIER_LABELS = {
  iconic:   "Iconic must-do",
  hidden:   "Hidden gem",
  fitness:  "Fitness / conditions",
  interest: "Interest specific",
  solid:    "Solid stop",
};
const CAT_LABELS = {
  nature:"Nature", glacier:"Glacier", geology:"Geology",
  wellness:"Wellness", wildlife:"Wildlife", culture:"Culture",
};
const HOTEL_COLOR = "#7c3aed";

let map, service, infoWindow;
let activityMarkers = [], hotelMarkers = [];
let currentLayer = "both";
let activeTiers = new Set(["iconic","hidden","fitness","interest","solid"]);

function applyVisibility() {
  const showA = currentLayer === "activities" || currentLayer === "both";
  const showH = currentLayer === "hotels"     || currentLayer === "both";
  activityMarkers.forEach((m, i) => {
    m.setVisible(showA && activeTiers.has(ACTIVITIES[i].tier));
  });
  hotelMarkers.forEach(m => m.setVisible(showH));
  document.getElementById("legend-activities").style.display = showA ? "" : "none";
  document.getElementById("legend-hotels").style.display = showH ? "" : "none";
  document.getElementById("legend-divider").style.display = (showA && showH) ? "" : "none";
  document.getElementById("tier-filter").style.display = showA ? "" : "none";
}

function setLayer(layer) {
  currentLayer = layer;
  ["activities","hotels","both"].forEach(id => {
    document.getElementById("btn-" + id).classList.toggle("active", id === layer);
  });
  infoWindow.close();
  applyVisibility();
}

function toggleTier(tier) {
  if (activeTiers.has(tier)) {
    activeTiers.delete(tier);
  } else {
    activeTiers.add(tier);
  }
  document.querySelector(`.tier-pill[data-tier="${tier}"]`).classList.toggle("active", activeTiers.has(tier));
  infoWindow.close();
  applyVisibility();
}

function starsHtml(r) {
  const full = Math.floor(r), half = r % 1 >= 0.5 ? 1 : 0, empty = 5 - full - half;
  return "★".repeat(full) + (half ? "½" : "") + "☆".repeat(empty);
}

function openCarouselPopup(placeId, contentFn) {
  infoWindow.setContent(`<div class="iw-wrap"><div class="iw-carousel-loading">Loading photos…</div></div>`);
  service.getDetails({ placeId, fields: ["photos"] }, (place, status) => {
    const photos = (status === google.maps.places.PlacesServiceStatus.OK && place.photos)
      ? place.photos.slice(0, 10) : [];
    const photoUrls = photos.map(p => p.getUrl({ maxWidth: 540, maxHeight: 300 }));
    const total = photoUrls.length;
    const carHtml = total > 0
      ? `<div class="iw-carousel" id="car-${placeId}">
           ${photoUrls.map((u,i) => `<img src="${u}" class="${i===0?"active":""}" />`).join("")}
           ${total>1 ? `<button class="car-btn car-prev">&#8249;</button><button class="car-btn car-next">&#8250;</button>` : ""}
           ${total>1 ? `<div class="car-dots">${photoUrls.map((_,i)=>`<button class="car-dot ${i===0?"active":""}" data-i="${i}"></button>`).join("")}</div>` : ""}
         </div>`
      : `<div class="iw-carousel-loading">No photos available</div>`;

    infoWindow.setContent(`<div class="iw-wrap">${carHtml}${contentFn()}</div>`);

    if (total > 1) {
      google.maps.event.addListenerOnce(infoWindow, "domready", () => {
        const car = document.getElementById("car-" + placeId);
        if (!car) return;
        const imgs = car.querySelectorAll("img"), dots = car.querySelectorAll(".car-dot");
        let cur = 0;
        function goTo(i) {
          imgs[cur].classList.remove("active"); if(dots[cur]) dots[cur].classList.remove("active");
          cur = (i + total) % total;
          imgs[cur].classList.add("active"); if(dots[cur]) dots[cur].classList.add("active");
        }
        car.querySelector(".car-prev")?.addEventListener("click", () => goTo(cur-1));
        car.querySelector(".car-next")?.addEventListener("click", () => goTo(cur+1));
        dots.forEach(d => d.addEventListener("click", () => goTo(parseInt(d.dataset.i))));
      });
    }
  });
}

function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 64.8, lng: -19.0 }, zoom: 6,
    mapTypeControl: false, streetViewControl: false, fullscreenControl: true,
    styles: [{ featureType:"poi", elementType:"labels", stylers:[{ visibility:"off" }] }],
  });
  service = new google.maps.places.PlacesService(map);
  infoWindow = new google.maps.InfoWindow({ maxWidth: 280 });

  // ── Activity markers (circles with count) ──────────────────────────────────
  ACTIVITIES.forEach(loc => {
    const r = 10 + Math.round((loc.count / 13) * 18);
    const color = TIER_COLORS[loc.tier];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${r*2}" height="${r*2}">
      <circle cx="${r}" cy="${r}" r="${r-1.5}" fill="${color}" stroke="white" stroke-width="2.5"/>
      <text x="${r}" y="${r}" text-anchor="middle" dominant-baseline="central"
        fill="white" font-size="${r>16?13:11}" font-weight="700"
        font-family="-apple-system,sans-serif">${loc.count}</text>
    </svg>`;
    const marker = new google.maps.Marker({
      position: { lat: loc.lat, lng: loc.lng }, map,
      icon: { url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg), scaledSize: new google.maps.Size(r*2, r*2), anchor: new google.maps.Point(r, r) },
      title: loc.name, zIndex: loc.count,
    });
    marker.addListener("click", () => {
      infoWindow.close();
      const linkHtml = loc.website ? `<a class="iw-link" href="${loc.website}" target="_blank" rel="noopener">Visit website →</a>` : "";
      openCarouselPopup(loc.placeId, () => `
        <div class="iw-body">
          <div class="iw-name">${loc.name}</div>
          <div style="display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap;">
            <div class="iw-badge" style="background:${color}">${TIER_LABELS[loc.tier]}</div>
            <div class="iw-badge" style="background:#888780">${CAT_LABELS[loc.cat]}</div>
          </div>
          <div class="iw-desc">${loc.desc}</div>
          <div class="iw-footer">
            <div class="iw-meta">In <strong>${loc.count}</strong> of 14 tours surveyed</div>
            ${linkHtml}
          </div>
        </div>`);
      infoWindow.open(map, marker);
    });
    activityMarkers.push(marker);
  });

  // ── Hotel markers (rounded-square pins) ────────────────────────────────────
  HOTELS.forEach(h => {
    const sz = 28;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz+8}">
      <polygon points="${sz/2},${sz+6} ${sz/2-5},${sz-2} ${sz/2+5},${sz-2}" fill="${HOTEL_COLOR}"/>
      <rect x="1" y="1" width="${sz-2}" height="${sz-2}" rx="4" fill="${HOTEL_COLOR}" stroke="white" stroke-width="2"/>
      <text x="${sz/2}" y="${sz/2}" text-anchor="middle" dominant-baseline="central"
        fill="white" font-size="9" font-weight="700"
        font-family="-apple-system,sans-serif">H</text>
    </svg>`;
    const marker = new google.maps.Marker({
      position: { lat: h.lat, lng: h.lng }, map,
      visible: true,
      icon: { url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg), scaledSize: new google.maps.Size(sz, sz+8), anchor: new google.maps.Point(sz/2, sz+8) },
      title: h.name, zIndex: Math.round(h.rating * 10),
    });
    marker.addListener("click", () => {
      infoWindow.close();
      const stars = starsHtml(h.rating);
      const webBtn = h.website ? `<a class="iw-link" href="${h.website}" target="_blank" rel="noopener">Website</a>` : "";
      const bookBtn = `<a class="iw-link" href="${h.booking}" target="_blank" rel="noopener">Search rooms →</a>`;
      openCarouselPopup(h.placeId, () => `
        <div class="iw-body">
          <div class="iw-name">${h.name}</div>
          <div class="iw-badge" style="background:${HOTEL_COLOR}">Hotel</div>
          <div class="iw-rating"><span class="iw-stars">${stars}</span>${h.rating.toFixed(1)} (${h.ratingCount.toLocaleString()} reviews)</div>
          <div class="iw-desc">${h.location}</div>
          <div class="iw-footer">${webBtn}${bookBtn}</div>
        </div>`);
      infoWindow.open(map, marker);
    });
    hotelMarkers.push(marker);
  });
}
</script>
